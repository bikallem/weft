# The tests on each push to main and on each pull request. The tools come from
# the dev shell of flake.nix, as on a local machine.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A status line for each test, and a limit for each test: a test that hangs
# fails with its name.
env:
  WINDTRAP_VERBOSE: "1"
  WINDTRAP_TIMEOUT: "120"

jobs:
  # Linux runs the suites of the Linux world, and macOS those of the kqueue
  # world. The two run the core, the simulator and dscheck.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build
        run: nix develop -c dune build
      # The result does not depend on the system.
      - name: Format
        if: runner.os == 'Linux'
        run: nix develop -c dune build @fmt
      - name: Test
        run: nix develop -c dune runtest --force

  # The mutation gate of a pull request (design section 2.17). make mutate
  # tests the mutants that test/core and test/sim reach on the lines that the
  # pull request changes. It gives a failure if one of these mutants
  # survives. A mutant that no test reaches gives no failure. The two Linux
  # suites test the lines of weft.posix and weft.linux, and the gate does not
  # test the lines of weft.kqueue.
  mutation:
    name: mutation (changed lines)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      # The checkout of a pull request is a merge commit of the pull request
      # into its base. Its first parent, HEAD^1, is the base at the time of the
      # event. Thus the diff from HEAD^1 holds only the lines of the pull
      # request, also when the base branch moves later, or when the base is
      # another branch.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: cachix/install-nix-action@v31
      - name: Test the mutants of the changed lines
        run: nix develop -c make mutate BASE=HEAD^1

  # FreeBSD in a VM. OCaml 5.5 and the test tools come from opam.
  freebsd:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Test on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          usesh: true
          prepare: |
            pkg install -y ocaml-opam gmake git bash pkgconf
          run: |
            set -e
            export OPAMROOTISOK=1 OPAMYES=1
            opam init --bare --disable-sandboxing
            opam switch create 5.5.0
            eval "$(opam env)"
            # The fork of windtrap at the commit of flake.lock.
            wt=git+https://github.com/bikallem/windtrap.git#8054b03cb7c580b3048afde86dc819c27815c7ce
            opam pin add -n windtrap "$wt"
            opam pin add -n ppx_windtrap "$wt"
            opam install dune windtrap ppx_windtrap dscheck
            dune build
            export WINDTRAP_VERBOSE=1 WINDTRAP_TIMEOUT=120
            dune runtest --force
