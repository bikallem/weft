# The tests on each push to main and on each pull request. The tools come from
# the dev shell of flake.nix, as on a local machine.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Linux runs all suites. macOS runs the core, the simulator, the portable
  # tests on the simulator and dscheck: the Linux world builds only on Linux.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build
        run: nix develop -c dune build
      - name: Format
        run: nix develop -c dune build @fmt
      - name: Test
        run: nix develop -c dune runtest --force

  # The TLA+ models of the design (spec/tla).
  tla:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Model check
        run: nix develop -c spec/tla/check.sh
