# Run the kqueue suite many times on macOS, to find a test that fails, hangs
# or crashes only sometimes. It runs only on request. At a failure, it gives
# the exit status and, for a crash, the backtrace of each thread. A run that
# takes more than 300 s is a hang: lldb gives the backtrace of each thread of
# the live process.
name: Stress

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "The number of runs of the suite"
        default: "30"

jobs:
  kqueue:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      WINDTRAP_VERBOSE: "1"
      WINDTRAP_TIMEOUT: "60"
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build
        run: nix develop -c dune build test/kqueue/test_kqueue.exe
      - name: Run the suite
        run: |
          sudo chmod 1777 /cores
          ulimit -c unlimited
          exe=$PWD/_build/default/test/kqueue/test_kqueue.exe
          for i in $(seq 1 ${{ inputs.runs }}); do
            "$exe" > kq.log 2>&1 &
            pid=$!
            t=0
            while kill -0 $pid 2>/dev/null && [ $t -lt 300 ]; do
              sleep 1
              t=$((t + 1))
            done
            if kill -0 $pid 2>/dev/null; then
              echo "run $i hangs"
              tail -30 kq.log
              sudo lldb -p $pid --batch -o "thread backtrace all" | head -400
              kill -9 $pid
              exit 1
            fi
            set +e
            wait $pid
            s=$?
            set -e
            if [ $s -ne 0 ]; then
              echo "run $i failed with status $s"
              grep -A60 "FAIL" kq.log | head -300 || true
              tail -30 kq.log
              for c in /cores/core.*; do
                [ -e "$c" ] || continue
                echo "core $c"
                lldb -c "$c" "$exe" --batch -o "thread backtrace all" | head -300
              done
              exit 1
            fi
            echo "run $i passed"
          done
      - name: Keep the log of the last run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kq-log
          path: kq.log
          if-no-files-found: ignore
