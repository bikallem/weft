# Run the kqueue suite many times on macOS, to find a test that fails or
# hangs only sometimes. It runs only on request.
name: Stress

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "The number of runs of the suite"
        default: "30"

jobs:
  kqueue:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      WINDTRAP_VERBOSE: "1"
      WINDTRAP_TIMEOUT: "60"
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build
        run: nix develop -c dune build test/kqueue/test_kqueue.exe
      - name: Run the suite
        run: |
          for i in $(seq 1 ${{ inputs.runs }}); do
            if ! nix develop -c ./_build/default/test/kqueue/test_kqueue.exe > kq.log 2>&1; then
              echo "run $i failed"
              grep -E "FAIL|TIMEOUT|timed out|expected|actual|│" kq.log | head -60
              tail -60 kq.log
              exit 1
            fi
            echo "run $i passed"
          done
