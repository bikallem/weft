# The TLA+ models of the design (spec/tla). They check the protocols, not the
# code, so they run only when a spec or this file changes, each Monday, and on
# request. The code of each protocol has its dscheck and simulator tests in
# ci.yml.
name: TLA+

on:
  push:
    branches: [main]
    paths: ["spec/tla/**", ".github/workflows/tla.yml"]
  pull_request:
    paths: ["spec/tla/**", ".github/workflows/tla.yml"]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  # One job for each group of models, each on its own runner (design section
  # 2.16). On a runner with 4 CPUs, check.sh runs 4 cases at the same time,
  # with 1 worker each.
  #
  # check.sh stops a case after LIMIT seconds, 2.5 times its slowest case or
  # more. In each job, the last case starts early enough that its LIMIT ends
  # before the timeout of the job.
  tla:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Wake has two jobs. Wake1 has the cases from before the wake
          # token, and Wake2 has the cases of the token. In one job, the 14
          # cases took 2 h 34 min. The slowest case of Wake1 took 5192 s, and
          # the slowest case of Wake2 took 5736 s. Each job takes about
          # 1 h 30 min to 1 h 40 min. The last case starts after about 30 min.
          - name: Wake1
            models: Wake1
            limit: 14400
            timeout: 300
          - name: Wake2
            models: Wake2
            limit: 14400
            timeout: 300
          # The slowest case took 1420 s on CI. The job takes about 35 min. A
          # case that hangs stops at LIMIT, also when it starts late.
          - name: Scope
            models: Scope
            limit: 3600
            timeout: 120
          # The slowest case takes about 2 min. The job takes about 3 min.
          # The Watchdog cases take a few seconds.
          - name: Commit, Ivar, Fd, Semaphore, Signal, Watchdog
            models: Commit Ivar Fd Semaphore Signal Watchdog
            limit: 900
            timeout: 30
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Model check
        env:
          MODELS: ${{ matrix.models }}
          LIMIT: ${{ matrix.limit }}
        run: nix develop -c spec/tla/check.sh
