# The TLA+ models of the design (spec/tla). They check the protocols, not the
# code, so they run only when a spec changes, each Monday, and on request. The
# code of each protocol has its dscheck and simulator tests in ci.yml.
name: TLA+

on:
  push:
    branches: [main]
    paths: ["spec/tla/**"]
  pull_request:
    paths: ["spec/tla/**"]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  tla:
    runs-on: ubuntu-24.04
    # A normal run takes about 1.5 h. check.sh stops each TLC run after
    # 1.5 h, and this limit stops the job if the script hangs.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Model check
        run: nix develop -c spec/tla/check.sh
